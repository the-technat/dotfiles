homebrew:
  linux:
    taps:
      - metalbear-co/mirrord
      - Azure/kubelogin
    tier3_brews: # at least tier 3 on arm64, thus only installed on amd64
      - yq # Tier 3 on ARM64
      - gh # Tier 3 on ARM64
      - dive # Tier 3 on ARM64
      - kind # Tier 3 on ARM64
      - terraform # Tier 3 on ARM64
      - terraform-ls # Tier 3 on ARM64
      - tflint # Tier 3 on ARM64
      - Azure/kubelogin/kubelogin # not working
      - gopls # Tier 3 on ARM64
    brews:
      - awscli
      - azure-cli
      - go
      - neovim
      - hubble
      - cilium-cli
      - flyctl
      - golangci-lint
      - helm
      - hugo
      - kubectl
      - uv
      - k9s
      - mirrord
      - stern
      - kustomize
      - kubie
      - eksctl
      - argocd
      - bat
      - nvm
      - fzf
      - yaml-language-server # used by nvim
      - vscode-langservers-extracted # used by nvim, contains html,css,json LS
      - lua-language-server # used by nvim
      - bash-language-server # used by nvim
      - dockerfile-language-server # used by nvim
  darwin:
    taps:
      - metalbear-co/mirrord
      - Azure/kubelogin
    brews:
      - make # neovim dependency
      - gcc # neovim dependency
      - nmap
      - unzip
      - btop
      - Azure/kubelogin/kubelogin
      - tmux
      - ripgrep # neovim dependency
      - vim
      - bat
      - jq
      - file-formula
      - tmux
      - awscli
      - azure-cli
      - neovim
      - go
      - hubble
      - cilium-cli
      - flyctl
      - fzf
      - golangci-lint
      - helm
      - hugo
      - kubectl
      - yq
      - gh
      - uv
      - dive
      - mirrord
      - terraform
      - stern
      - kustomize
      - kubie
      - terraform-ls # used by nvim
      - tflint
      - eksctl
      - argocd
      - bat
      - gopls # used by nvim
      - nvm
      - yaml-language-server # used by nvim
      - vscode-langservers-extracted # used by nvim, contains html,css,json LS
      - lua-language-server # used by nvim
      - bash-language-server # used by nvim
      - dockerfile-language-server # used by nvim
    casks: # casks are macos-only
      - "ghostty" # prefered terminal emulator on darwin
      - "devtoys" # helpful developer tools
      - "vscodium" # do it all IDE
      - "font-fira-code-nerd-font" # font for terminal
      - "session-manager-plugin" # used for SSH over SSM
      - "secretive" # hardware-backed ssh keys
      - "mactracker" # mac database
      - "orbstack" # docker-engine + lightweight linux machines
      - "viable" # simple macos hypervisor GUI
      - "liviable" # simple linux hypervisor GUI
