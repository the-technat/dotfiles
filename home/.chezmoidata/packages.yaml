homebrew: 
  linux:
    taps: 
    - metalbear-co/mirrord
    brews: 
    - awscli
    - azure-cli
    - go
    - neovim
    - kubelogin
    - hubble
    - cilium-cli
    - flyctl
    - fzf # Tier 3 on ARM64
    - golangci-lint
    - helm
    - hugo
    - kubectl
    - yq # Tier 3 on ARM64
    - gh # Tier 3 on ARM64
    - uv
    - dive # Tier 3 on ARM64
    - k9s
    - kind # Tier 3 on ARM64
    - mirrord
    - terraform # Tier 3 on ARM64
    - stern
    - kustomize
    - kubie
    - terraform-ls # Tier 3 on ARM64
    - tflint # Tier 3 on ARM64
    - eksctl
    - argocd
    - bat
  darwin:
    taps: 
    - metalbear-co/mirrord
    brews:
    - make
    - gcc
    - nmap
    - unzip
    - btop
    - tmux
    - ripgrep
    - vim
    - bat
    - jq
    - file-formula
    - tmux
    - awscli 
    - azure-cli
    - neovim
    - go
    - kubelogin
    - hubble
    - cilium-cli
    - flyctl
    - fzf
    - golangci-lint
    - helm
    - hugo
    - kubectl
    - yq
    - gh
    - uv
    - dive
    - mirrord
    - terraform
    - stern
    - kustomize
    - kubie
    - terraform-ls 
    - tflint
    - eksctl
    - argocd
    - bat
    casks: # casks are macos-only
      - "ghostty" # prefered terminal emulator on darwin
      - "devtoys" # helpful developer tools
      - "visual-studio-code" # do it all IDE
      - "font-fira-code-nerd-font" # font for terminal
      - "session-manager-plugin" # used for SSH over SSM
      - "devpod" # codespaces but local
      - "secretive" # hardware-backed ssh keys
      - "mactracker" # mac database
      - "orbstack" # docker-engine + lightweight linux machines
      - "utm" # do it all hypervisor for other VMs
      - "mist" # macos installer utility
      - "crystalfetch" # windows installer utility
