apt:
  - git # prerequisite for homebrew
  - sudo # required by some scripts
  - zsh # prerequisite for shell
  - procps # required by homebrew
  - gcc # required to compile some brews
  - gnupg # required by many tools
  - traceroute # no brew
  - bind9-dnsutils # no brew
  - tar # no brew
apt_remote:
  x86_64:
    - https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
  arm64:
    - https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_arm64/session-manager-plugin.deb
dnf:
  - git # required by homebrew
  - sudo # required by some scripts
  - zsh # prerequisite for shell
  - procps # required by homebrew
  - gcc # required to compile some brews
  - gnupg # required by many tools
  - bind-utils # no brew
  - traceroute # no brew
  - tar # no brew
dnf_remote:
  x86_64:
    - https://s3.amazonaws.com/session-manager-downloads/plugin/latest/linux_64bit/session-manager-plugin.rpm
  arm64:
    - https://s3.amazonaws.com/session-manager-downloads/plugin/latest/linux_arm64/session-manager-plugin.rpm
apk:
  - git # required by homebrew
  - sudo # required by some scripts
  - zsh # prerequisite for shell
  - openssh # contains ssh-keygen to generate ssh-key
  - shadow # contains usermod to change shell 
  - bash # required to install homebrew
  - ruby # since we don't have glibc we install latest ruby for homebrew
  - gcc # required to compile some brews
  - gnupg # required by many tools
  - tar # no brew
  - bind-tools # no brew
  - traceroute # no brew
tdnf:
  - git # required by homebrew
  - sudo # required by some scripts
  - zsh # prerequisite for shell
  - procps # required by homebrew
  - gcc # required to compile some brews
  - gnupg # required by many tools
  - traceroute # no brew
  - bind-utils # no brew
  - tar # no brew
homebrew:
  common:
    taps:
      - metalbear-co/mirrord
      - Azure/kubelogin
      - hashicorp/tap
      - sdkman/tap
    brews:
      - tmux
      # Neovim
      - neovim
      - vim
      - make # neovim dependency
      - gcc # neovim dependency
      - fd # neovim dependency
      - lazygit # neovim dependency
      - ripgrep # neovim dependency
      - fzf # neovim dependency
      - tree-sitter-cli # neovim dependency
      - ast-grep # neovim dependency
      - luarocks # neovim dependency
      - lua # neovim dependency
      - imagemagick # neovim dependency
      - gs # neovim dependency
      - tectonic # neovim dependency
      # Java Dev
      - sdkman-cli 
      - zip # required by sdkman
      # Node
      - nvm 
      # Python
      - uv 
      # Go
      - go
      - golangci-lint
      # Debugging
      - mirrord
      # Kubernetes
      - hubble
      - cilium-cli
      - helm
      - kubectl
      - kustomize
      - kubie
      - eksctl
      - argocd
      - k9s
      - stern
      - kind
      - dive
      # Cloud
      - awscli
      - azure-cli
      - flyctl
      - hashicorp/tap/terraform
      - tflint
      # Networking
      - nmap
      - tailscale
      # Files
      - bat
      - yq
      - jq
      - file-formula
      # Git
      - gh
      # Processes
      - btop
      # Archives
      - unzip
      # Static Sites
      - hugo
  linux:
    taps: []
    tier3_brews: # at least tier 3 on arm64, thus only installed on amd64
      - Azure/kubelogin/kubelogin # not working
      - net-tools
      - gawk
    brews: []
  darwin:
    taps: []
    brews: 
    - Azure/kubelogin/kubelogin
    casks: # casks are macos-only
      - "ghostty" # prefered terminal emulator on darwin
      - "devtoys" # helpful developer tools
      - "vscodium" # do it all IDE
      - "font-fira-code-nerd-font" # font for terminal
      - "session-manager-plugin" # used for SSH over SSM
      - "secretive" # hardware-backed ssh keys
      - "mactracker" # mac database
      - "orbstack" # docker-engine + lightweight linux machines
      - "tailscale-app"
